# vLLM Profiler Configuration
# Loaded by /tmp/vllm-profiler/sitecustomize.py (via PYTHONPATH)

# Which execute_model calls to profile (inclusive on both ends).
# Example: "5-10" profiles calls 5, 6, 7, 8, 9, and 10.
profiling_ranges: "5-10"

activities: "CPU,CUDA"

options:
  record_shapes: true
  with_stack: true
  profile_memory: false
  with_modules: false

output:
  export_chrome_trace: true
  # {rank} = torch.distributed rank; {pid} = process id
  file_pattern: "/tmp/vllm_profile/trace_rank{rank}_pid{pid}_range{start}-{end}.json"
  table:
    enabled: true
    sort_by: "self_cuda_time_total"
    row_limit: 50
  print_stats: true

advanced:
  # Ray (--distributed-executor-backend ray) uses Ray compiled DAG ->
  # RayWorkerWrapper.execute_model_ray -> GPUModelRunner.execute_model.
  # It does NOT call Worker.execute_model.
  targets:
    - module: vllm.v1.worker.gpu_model_runner
      class: GPUModelRunner
      method: execute_model

  # Profile only this global rank (0-15 for TP8 PP2). Omit or null for all ranks.
  profile_rank: 0

  debug: true
